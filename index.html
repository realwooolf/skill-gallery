<html lang="zh">
<head>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f6f6f4;
  --white:    #ffffff;
  --border:   #e8e8e4;
  --text-1:   #1a1a1a;
  --text-2:   #4a4a4a;
  --text-3:   #9a9a9a;
  --accent:   #0f0f0f;
  --blue:     #2563eb;
  --blue-bg:  #eff6ff;
  --blue-bd:  #bfdbfe;
  --radius:   10px;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Inter', system-ui, sans-serif;
}

html { font-size: 14px; }
body { background: var(--bg); color: var(--text-1); font-family: var(--font-sans); line-height: 1.5; min-height: 100vh; }

/* ─── TOP BAR ─── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex;
  align-items: center;
  height: 52px;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-1);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.logo-sep { color: var(--text-3); margin: 0 2px; }

.search-wrap {
  flex: 1;
  max-width: 360px;
  position: relative;
}

.search-wrap svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}

#search {
  width: 100%;
  height: 34px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0 12px 0 34px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-1);
  outline: none;
  transition: border-color .15s, background .15s;
}
#search::placeholder { color: var(--text-3); }
#search:focus { background: var(--white); border-color: #aaa; }

.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
}

.tab {
  height: 28px;
  padding: 0 11px;
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-3);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: color .12s, background .12s;
  white-space: nowrap;
}
.tab:hover { color: var(--text-2); background: var(--bg); }
.tab.active { color: var(--text-1); background: var(--bg); border: 1px solid var(--border); }

/* ─── LAYOUT ─── */
.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: calc(100vh - 52px);
}

/* ─── SIDEBAR ─── */
.sidebar {
  padding: 28px 0;
  border-right: 1px solid var(--border);
  background: var(--white);
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}

.sidebar-section { margin-bottom: 24px; }

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 0 20px;
  margin-bottom: 6px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  border-radius: 0;
  transition: color .12s, background .12s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.sidebar-item:hover { color: var(--text-1); background: var(--bg); }
.sidebar-item.active { color: var(--text-1); background: #f0f0ec; }

.sidebar-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-item-left { display: flex; align-items: center; gap: 10px; }

.count-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 6px;
}

.legend-wrap {
  padding: 16px 20px 0;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-3);
  margin-bottom: 7px;
}

.legend-pip {
  width: 3px;
  height: 14px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ─── CONTENT ─── */
.content { padding: 32px 36px 64px; }

.section { margin-bottom: 40px; }
.section.hidden { display: none; }

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}

.section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-1);
}

.section-en {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 400;
}

.section-cnt {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  margin-left: auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}

/* ─── CARD ─── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  transition: box-shadow .18s, border-color .18s, transform .18s;
  cursor: default;
}
.card:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,.08);
  border-color: #d4d4d0;
  transform: translateY(-2px);
}

.card.self-made {
  background: var(--blue-bg);
  border-color: var(--blue-bd);
}
.card.self-made:hover {
  border-color: #93c5fd;
  box-shadow: 0 6px 20px rgba(37,99,235,.1);
}

.card.hidden { display: none; }

.self-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 10px;
  font-weight: 600;
  color: var(--blue);
  background: #dbeafe;
  border: 1px solid var(--blue-bd);
  border-radius: 5px;
  padding: 2px 7px;
  letter-spacing: .02em;
}

.card-name {
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-1);
  margin-bottom: 7px;
  padding-right: 52px;
  line-height: 1.4;
}
.card.self-made .card-name { color: var(--blue); }

.card-desc {
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 12px;
}

.card-foot {
  display: flex;
  align-items: center;
  gap: 6px;
}

.cat-tag {
  display: none;
  font-size: 10.5px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 5px;
  flex-shrink: 0;
}
body.show-tags .cat-tag { display: inline-block; }

.card-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  font-size: 11px;
  color: var(--text-3);
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 3px;
}

.meta-sep { color: var(--border); }

/* ─── EMPTY ─── */
.empty-state {
  display: none;
  padding: 80px 0;
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
}
.empty-state p { margin-top: 8px; }

/* ─── STATS ROW ─── */
.stats-row {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-n {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 500;
  color: var(--text-1);
  line-height: 1;
}
.stat-n.blue { color: var(--blue); }

.stat-l {
  font-size: 11px;
  color: var(--text-3);
}

/* ─── CATEGORY COLORS ─── */
.dot-设计   { background: #f97316; }
.dot-工具   { background: #22c55e; }
.dot-文档   { background: #8b5cf6; }
.dot-求职   { background: #ef4444; }
.dot-元工具 { background: #94a3b8; }

.pip-self    { background: var(--blue); }
.pip-install { background: #d4d4d0; }

.tag-设计   { background: #fff7ed; color: #c2410c; }
.tag-工具   { background: #f0fdf4; color: #15803d; }
.tag-文档   { background: #f5f3ff; color: #7c3aed; }
.tag-求职   { background: #fff1f2; color: #be123c; }
.tag-元工具 { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

/* mobile-tabs 默认隐藏，只在手机显示 */
.mobile-tabs { display: none; }

/* ─── MOBILE ─── */
@media (max-width: 680px) {
  /* topbar */
  .topbar {
    padding: 12px 16px;
    height: auto;
    flex-wrap: wrap;
    gap: 8px;
  }
  .logo { font-size: 12px; }
  .search-wrap { order: 3; max-width: 100%; flex: 0 0 100%; }
  .tabs { display: none; }

  /* mobile category tabs */
  .mobile-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 16px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 88px;
    z-index: 15;
  }
  .mobile-tabs::-webkit-scrollbar { display: none; }
  .mobile-tabs .tab {
    height: 30px;
    padding: 0 13px;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 20px;
    flex-shrink: 0;
    color: var(--text-2);
  }
  .mobile-tabs .tab.active {
    background: var(--text-1);
    color: #fff;
    border-color: var(--text-1);
  }

  /* layout: hide sidebar, full width */
  .sidebar { display: none; }
  .layout { grid-template-columns: 1fr; }

  /* content */
  .content { padding: 16px 16px 48px; }

  /* stats */
  .stats-row { gap: 6px; margin-bottom: 16px; }
  .stat-card { padding: 10px 14px; }
  .stat-n { font-size: 17px; }
  .stat-l { font-size: 10px; }

  /* grid: single column */
  .grid { grid-template-columns: 1fr; gap: 8px; }

  /* section */
  .section { margin-bottom: 24px; }
  .section-head { margin-bottom: 10px; }
  .section-title { font-size: 14px; }
  .section-en { display: none; }

  /* card */
  .card { padding: 13px 14px; }
  .card-name { font-size: 12px; }
  .card-desc { font-size: 12px; margin-bottom: 8px; }
  .card-meta { font-size: 10px; }
}
</style>
</head>

const cats = ['设计','工具','文档','求职','元工具'];

// Build grids
cats.forEach(cat => {
  const grid = document.getElementById('grid-' + cat);
  skills.filter(s => s.cat === cat).forEach(s => grid.appendChild(makeCard(s)));
});

function makeCard(s) {
  const el = document.createElement('div');
  el.className = 'card' + (s.self ? ' self-made' : '');
  el.dataset.name = s.name;
  el.dataset.cat = s.cat;

  const date = installDates[s.name] || '';
  const uses = usageCounts[s.name] || 0;
  const dateStr = date ? date.slice(5).replace('-', '/') : '—'; // "06/08"
  const usesStr = `${uses} 次`;

  el.innerHTML =
    (s.self ? '<span class="self-badge">自制</span>' : '') +
    `<div class="card-name">/${s.name}</div>` +
    `<div class="card-desc">${s.desc}</div>` +
    `<div class="card-foot">
      <span class="cat-tag tag-${s.cat}">${s.cat}</span>
      <span class="card-meta">
        <span class="meta-item" title="安装日期">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="2" width="10" height="9" rx="1.5"/><path d="M4 1v2M8 1v2M1 5h10" stroke-linecap="round"/></svg>
          ${dateStr}
        </span>
        <span class="meta-sep">·</span>
        <span class="meta-item" title="使用次数">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 1v5l3 2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="6" r="5"/></svg>
          ${usesStr}
        </span>
      </span>
    </div>`;
  return el;
}

// Fuse — 搜索 name + desc + kw，name 权重更高
const fuse = new Fuse(skills, {
  keys: [
    { name:'name', weight: 0.4 },
    { name:'desc', weight: 0.35 },
    { name:'kw',   weight: 0.25 },
  ],
  threshold: 0.38,
  minMatchCharLength: 1,
  ignoreLocation: true,   // 不限制匹配位置，对中文更友好
});

// 辅助：简单 substring 匹配（name + desc + kw 任一包含即命中）
function substringMatch(s, q) {
  const h = (s.name + ' ' + s.desc + ' ' + (s.kw || '')).toLowerCase();
  return q.split(/\s+/).every(token => h.includes(token));
}

// State
let activeTab = 'all';
const searchEl = document.getElementById('search');

// Tab clicks — topbar
document.querySelectorAll('.topbar .tab').forEach(t => {
  t.addEventListener('click', () => {
    setTab(t.dataset.cat);
    filter();
  });
});

// Sidebar clicks
document.querySelectorAll('.sidebar-item').forEach(t => {
  t.addEventListener('click', () => {
    setTab(t.dataset.cat);
    filter();
  });
});

function setTab(cat) {
  activeTab = cat;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.cat === cat));
  document.querySelectorAll('.sidebar-item').forEach(t =>
    t.classList.toggle('active', t.dataset.cat === cat));
  // scroll active mobile tab into view
  const mobileActive = document.querySelector('.mobile-tabs .tab.active');
  if (mobileActive) mobileActive.scrollIntoView({ inline: 'center', behavior: 'smooth' });
}

searchEl.addEventListener('input', filter);

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault(); searchEl.focus();
  }
  if (e.key === 'Escape') { searchEl.value = ''; filter(); searchEl.blur(); }
});

function filter() {
  const q = searchEl.value.trim();
  let matchedNames = null;
  if (q) {
    const ql = q.toLowerCase();
    // Fuse 模糊结果
    const fuseHits = new Set(fuse.search(q).map(r => r.item.name));
    // substring 直接匹配（OR 合并，弥补 Fuse 对中文短词的漏判）
    skills.forEach(s => { if (substringMatch(s, ql)) fuseHits.add(s.name); });
    matchedNames = fuseHits;
  }

  const needTags = activeTab === 'all' || !!q;
  document.body.classList.toggle('show-tags', needTags);

  let total = 0;
  const catCounts = {};

  cats.forEach(cat => {
    const section = document.querySelector('[data-section="' + cat + '"]');
    let vis = 0;
    section.querySelectorAll('.card').forEach(c => {
      const show = (activeTab === 'all' || c.dataset.cat === activeTab)
                && (!matchedNames || matchedNames.has(c.dataset.name));
      c.classList.toggle('hidden', !show);
      if (show) { vis++; total++; }
    });
    section.classList.toggle('hidden', vis === 0);
    catCounts[cat] = vis;
    const cntEl = document.getElementById('cnt-' + cat);
    if (cntEl) cntEl.textContent = vis;
    const sbEl = document.getElementById('sb-' + cat);
    if (sbEl) sbEl.textContent = vis;
  });

  document.getElementById('stat-total').textContent = total;
  document.getElementById('sb-all').textContent = total;
  document.getElementById('empty').style.display = total === 0 ? 'block' : 'none';
}

// Init counts
filter();
